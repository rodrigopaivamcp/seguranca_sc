name: Supply Chain Security Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-sign-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Necessário para o Keyless Signing (OIDC) com Sigstore

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      # 1. Instalação das Ferramentas
      - name: Instalar Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Instalar Cosign
        uses: sigstore/cosign-installer@v3.5.0

      # 2. Geração da SBOM
      - name: Gerar SBOM do repositório (SPDX JSON)
        run: |
          syft dir:. -o spdx-json > sbom.spdx.json

      # 3. Assinatura Automática sem Chave (Keyless Signing)
      - name: Assinar a SBOM via OIDC (Sigstore/Rekor)
        run: |
          cosign sign-blob \
            --output-certificate sbom.spdx.json.pem \
            --output-signature sbom.spdx.json.sig \
            sbom.spdx.json

      # 4. Upload dos Artefatos Assinados
      - name: Salvar SBOM e Assinatura no GitHub
        uses: actions/upload-artifact@v4
        with:
          name: sbom-and-signature
          path: |
            sbom.spdx.json
            sbom.spdx.json.sig
            sbom.spdx.json.pem

      # 5. Validação da Assinatura no Runner
      - name: Validar Assinatura no Pipeline
        run: |
          cosign verify-blob \
            --certificate sbom.spdx.json.pem \
            --signature sbom.spdx.json.sig \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/supply-chain.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            sbom.spdx.json