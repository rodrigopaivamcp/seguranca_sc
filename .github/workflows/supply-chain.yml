name: Supply Chain Security Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-sign-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      # 1. Instalar Cosign
      - name: Instalar Cosign
        uses: sigstore/cosign-installer@v3.5.0

      # 2. Instalar Syft CLI
      - name: Instalar Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      # 3. Gerar SBOM
      - name: Gerar SBOM
        run: |
          syft dir:. -o spdx-json=sbom.spdx.json

      # 4. Assinar a SBOM via Keyless (OIDC Sigstore)
      - name: Assinar SBOM
        run: |
          cosign sign-blob \
            --output-certificate sbom.spdx.json.pem \
            --output-signature sbom.spdx.json.sig \
            --yes \
            sbom.spdx.json

      # 5. Salvar Artefatos
      - name: Salvar Artefatos no GitHub
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifacts
          path: |
            sbom.spdx.json
            sbom.spdx.json.sig
            sbom.spdx.json.pem

      # 6. Validar Assinatura
      - name: Validar Assinatura no Pipeline
        run: |
          cosign verify-blob \
            --certificate sbom.spdx.json.pem \
            --signature sbom.spdx.json.sig \
            --certificate-identity-regexp "https://github.com/${{ github.repository_owner }}/*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            sbom.spdx.json